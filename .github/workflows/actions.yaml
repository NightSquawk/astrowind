name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Node 18 dropped 2026-09-18: sharp>=0.35.4 (security fix for
        # GHSA-rgj7-g3m4-5g8c) requires node>=20.9.0, and undici/wrangler/cheerio
        # in this tree already required >=20.18.1 (EBADENGINE warnings on 18).
        node-version:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # - run: npm test

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
